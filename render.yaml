services:
  - type: web
    name: nexadocs-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: EMBEDDING_PROVIDER
        value: GEMINI
      - key: VECTOR_STORAGE_TYPE
        value: POSTGRES
      - key: STORAGE_TYPE
        value: S3
      - key: S3_BUCKET_NAME
        value: nexadocs-files
      - key: S3_REGION
        value: us-east-2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://nexa-docs.vercel.app", "https://nexadocs.vercel.app"]'
      - key: DEBUG
        value: "False"
