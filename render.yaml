services:
  - type: web
    name: nexadocs-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexadocs-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_TYPE
        value: LOCAL

databases:
  - name: nexadocs-db
    databaseName: nexadocs_db
    user: nexadocs_user
    plan: free
