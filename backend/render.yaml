services:
  - type: web
    name: nexadocs-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexadocs-db
          property: connectionString

databases:
  - name: nexadocs-db
    databaseName: nexadocs
    user: nexadocs_user
    plan: free
