version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexadocs-postgres
    environment:
      POSTGRES_USER: nexadocs_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: nexadocs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexadocs_user -d nexadocs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexadocs-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nexadocs_user:securepassword@postgres:5432/nexadocs_db
      - JWT_SECRET=nexadocs-super-secret-enterprise-jwt-key-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexadocs-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
